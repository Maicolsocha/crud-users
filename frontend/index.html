
<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Usuarios</title>
</head>

<body>

    <main class="container">

        <h1>Gestión de usuarios</h1>

        <section class="card">

            <h2 id="form-title">Registrar usuario</h2>

            <form id="user-form">

                <label for="name">Nombre</label>

                <input
                    type="text"
                    id="name"
                    maxlength="100"
                    required
                >

                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    maxlength="255"
                    required
                >

                <button type="submit" id="save-button">
                    Guardar usuario
                </button>

                <button type="button" id="cancel-button" hidden>
                    Cancelar edición
                </button>

            </form>

        </section>

        <p id="message" role="status"></p>

        <section class="card">

            <h2>Usuarios registrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Fecha de creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="users-table"></tbody>

            </table>

        </section>

    </main>

    <script type="module" src="src/main.js"></script>

</body>
</html>
